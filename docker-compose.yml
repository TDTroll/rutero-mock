# Entorno local. En Render se usa render.yaml (runtime: docker).
#
# El servicio rutero es autocontenido: backend Flask + web + config.
# Para anadir los servicios futuros (db, ui, auth) se agregan aqui y en
# services/, sin tocar el contenedor de rutero.
name: rutero-mock

services:
  rutero:
    build:
      context: ./services/rutero
      dockerfile: Dockerfile
    image: rutero-mock:local
    ports:
      - "${RUTERO_PORT:-8080}:8080"
    environment:
      PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/status')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

