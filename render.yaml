services:
  - type: web
    name: rutero-mock
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /status
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
