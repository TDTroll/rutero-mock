<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RUTERO - Seleccionar UI JSON</title>
<link rel="stylesheet" href="/rutero/static/menu.css">
<style>
  .dropzone {
    display: block;
    margin-top: 18px;
    padding: clamp(22px, 4vw, 34px);
    text-align: center;
    cursor: pointer;
    color: inherit;
    border: 2px dashed var(--border);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.03);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .dropzone:hover,
  .dropzone:focus-within,
  .dropzone.dragover {
    border-color: rgba(255, 167, 38, 0.65);
    background: rgba(255, 167, 38, 0.1);
  }
  .dropzone-title { display: block; font-weight: 600; }
  .dropzone-sub { display: block; margin-top: 6px; font-size: 0.9em; opacity: 0.7; }
</style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">A</div>
      <div>
        <p class="brand-name">AIDRIVER</p>
        <p class="brand-sub">Aplicar dashboard online</p>
      </div>
    </header>

    <section class="hero" aria-labelledby="ui-title">
      <p class="eyebrow">Centro de control</p>
      <h1 id="ui-title">UI JSON Online</h1>
      <p class="lead">Selecciona full.json o pullman.json para aplicarlo a la aplicación Android.</p>
    </section>

    <nav class="modules" aria-label="Dashboards disponibles">
      <button class="module" data-name="full" id="btn-full">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="6" y="10" width="36" height="28" rx="6" stroke="currentColor" stroke-width="2"/>
            <path d="M6 18h36" stroke="currentColor" stroke-width="2"/>
          </svg>
        </span>
        <span class="module-copy">
          <span class="module-kicker">Dashboard</span>
          <span class="module-title">full.json</span>
          <span class="module-desc">Configuración completa de dashboards.</span>
        </span>
        <span class="module-open" aria-hidden="true">Aplicar</span>
      </button>

      <button class="module" data-name="pullman" id="btn-pullman">
        <span class="module-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <rect x="8" y="14" width="32" height="20" rx="4" stroke="currentColor" stroke-width="2"/>
            <circle cx="16" cy="30" r="2" fill="currentColor"/>
            <circle cx="32" cy="30" r="2" fill="currentColor"/>
          </svg>
        </span>
        <span class="module-copy">
          <span class="module-kicker">Dashboard</span>
          <span class="module-title">pullman.json</span>
          <span class="module-desc">Configuración específica Pullman.</span>
        </span>
        <span class="module-open" aria-hidden="true">Aplicar</span>
      </button>
    </nav>

    <label class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept=".json,application/json" hidden>
      <span class="dropzone-title">Arrastra aquí un JSON</span>
      <span class="dropzone-sub">o haz clic para elegir un archivo</span>
    </label>

    <div class="service-status" id="status" data-state="loading" role="status" aria-live="polite">
      <span class="service-dot" aria-hidden="true"></span>
      <span id="status-text">Selecciona un JSON para aplicarlo online.</span>
    </div>

    <footer class="footer">
      <a href="/menu" style="color:inherit;text-decoration:none;">← Volver al menú</a>
      <span>ACTIA</span>
      <span>RUTERO · mock online</span>
    </footer>
  </main>

  <script>
    (function(){
      var status = document.getElementById('status');
      var text = document.getElementById('status-text');
      function set(s, t){ if(status) status.dataset.state=s; if(text) text.textContent=t; }
      fetch('/api/dashboard/list', {cache:'no-store'})
        .then(function(r){return r.json();})
        .then(function(j){ if(j.active) set('online','Activo: '+j.active+'.json'); })
        .catch(function(){});
      var dropzone = document.getElementById('dropzone');
      var fileInput = document.getElementById('file-input');
      function uploadFile(file){
        if(!file) return;
        if(!/\.json$/i.test(file.name) && file.type !== 'application/json'){
          set('offline','Selecciona un archivo .json'); return;
        }
        set('loading','Subiendo '+file.name+'...');
        var form = new FormData();
        form.append('file', file, file.name);
        fetch('/api/dashboard/upload', {method:'POST', body: form})
          .then(function(r){
            return r.json().catch(function(){ return {error:'respuesta invalida ('+r.status+')'}; });
          })
          .then(function(j){
            if(j.ok) set('online','✓ '+j.name+'.json aplicado. La app Android lo aplicará automáticamente en unos segundos.');
            else set('offline', j.error || 'Error');
          })
          .catch(function(e){ set('offline','Error: '+e.message); });
      }
      fileInput.addEventListener('change', function(){
        uploadFile(fileInput.files[0]);
        fileInput.value = '';
      });
      ['dragenter','dragover'].forEach(function(ev){
        dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.add('dragover'); });
      });
      ['dragleave','drop'].forEach(function(ev){
        dropzone.addEventListener(ev, function(e){ e.preventDefault(); dropzone.classList.remove('dragover'); });
      });
      dropzone.addEventListener('drop', function(e){ uploadFile(e.dataTransfer.files[0]); });
      window.addEventListener('dragover', function(e){ e.preventDefault(); });
      window.addEventListener('drop', function(e){ e.preventDefault(); });

      document.querySelectorAll('.module[data-name]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var name = btn.getAttribute('data-name');
          set('loading','Enviando '+name+'.json al Android...');
          fetch('/api/dashboard/select', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({name:name})
          }).then(function(r){return r.json();})
            .then(function(j){
              if(j.ok){
                set('online','✓ Enviado '+name+'.json al servidor. La app Android lo aplicará automáticamente en unos segundos.');
                fetch('/api/dashboard/active', {cache:'no-store'}).catch(function(){});
              }
              else { set('offline', j.error || 'Error'); }
            })
            .catch(function(e){ set('offline','Error: '+e.message); });
        });
      });
    })();
  </script>
</body>
</html>
